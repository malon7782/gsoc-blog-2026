<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bloggin' GSoC!</title>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body {
      max-width: 40vw; 
      min-width: 320px; 
      padding: 20px 40px;
      font-family: Georgia, serif; 
      line-height: 1.6;
    }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    img { max-width: 100%; height: auto; }
    
    pre { 
      background: #f6f8fa; 
      padding: 16px; 
      border-radius: 6px; 
      overflow-x: auto; 
    }
    code { font-family: Consolas, Monaco, monospace; font-size: 0.9em; }
    
    .original-link {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px dashed #ccc;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    const owner = 'malon7782';
    const repo = 'gsoc-blog-2026';
    const app = document.getElementById('app');

    async function fetchAPI(url) {
      const res = await fetch(url);
      return await res.json();
    }

    async function renderList() {
      app.innerHTML = 'Loading...';
      const issues = await fetchAPI(`https://api.github.com/repos/${owner}/${repo}/issues?state=open`);
      
      let html = '<ul>';
      issues.forEach(issue => {
        if (!issue.pull_request) {
          html += `<li style="margin-bottom: 10px;"><a href="#${issue.number}" onclick="renderPost(${issue.number})">${issue.title}</a></li>`;
        }
      });
      html += '</ul>';
      app.innerHTML = html;
    }

    async function renderPost(number) {
      app.innerHTML = 'Loading...';
      const issue = await fetchAPI(`https://api.github.com/repos/${owner}/${repo}/issues/${number}`);
      
      const markdownContent = marked.parse(issue.body || '');
      
      app.innerHTML = `
        <a href="#" onclick="renderList()">← Back to Table of Contents</a>
        <h1>${issue.title}</h1>
        <div class="markdown-body">
          ${markdownContent}
        </div>
        <div class="original-link">
          <a href="${issue.html_url}" target="_blank">View original post on GitHub</a>
        </div>
      `;

      hljs.highlightAll();
    }

    function router() {
      const hash = window.location.hash.substring(1);
      if (hash) {
        renderPost(hash);
      } else {
        renderList();
      }
    }

    window.addEventListener('hashchange', router);
    router();
  </script>
</body>
</html>
