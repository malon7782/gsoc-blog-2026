<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bloggin' GSoC!</title>
  <style>
    body {
      max-width: 25vw; 
      min-width: 320px; 
      padding: 20px 40px;
      font-family: Georgia, serif; 
      line-height: 1.6;
    }
    pre {
      font-family: inherit; 
      white-space: pre-wrap; 
      word-wrap: break-word;
    }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .original-link {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px dashed #ccc;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    const owner = 'malon7782';
    const repo = 'gsoc-blog-2026';
    const app = document.getElementById('app');

    async function fetchAPI(url) {
      const res = await fetch(url);
      return await res.json();
    }

    async function renderList() {
      app.innerHTML = 'Loading...';
      const issues = await fetchAPI(`https://api.github.com/repos/${owner}/${repo}/issues?state=open`);
      
      let html = '<ul>';
      issues.forEach(issue => {
        if (!issue.pull_request) {
          html += `<li style="margin-bottom: 10px;"><a href="#${issue.number}" onclick="renderPost(${issue.number})">${issue.title}</a></li>`;
        }
      });
      html += '</ul>';
      app.innerHTML = html;
    }

    async function renderPost(number) {
      app.innerHTML = 'Loading...';
      const issue = await fetchAPI(`https://api.github.com/repos/${owner}/${repo}/issues/${number}`);
      
      app.innerHTML = `
        <a href="#" onclick="renderList()">← Back to List</a>
        <h1>${issue.title}</h1>
        <pre>${issue.body}</pre>
        <div class="original-link">
          <a href="${issue.html_url}" target="_blank">View original issue on GitHub</a>
        </div>
      `;
    }

    function router() {
      const hash = window.location.hash.substring(1);
      if (hash) {
        renderPost(hash);
      } else {
        renderList();
      }
    }

    window.addEventListener('hashchange', router);
    router();
  </script>
</body>
</html>
